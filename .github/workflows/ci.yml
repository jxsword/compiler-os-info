name: CI - Cross-platform Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # 允许手动触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 所有平台、所有生成器的产物统一落在 <build>/bin
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  build-ubuntu-gcc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B "$BUILD_DIR" \
                -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
                -DCMAKE_C_COMPILER=gcc

      - name: Build
        run: cmake --build "$BUILD_DIR" --config ${{ matrix.build-type }}

      - name: Run executable
        run: "$BUILD_DIR/bin/CompilerOSInfo"

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" -C ${{ matrix.build-type }} --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-gcc-${{ matrix.build-type }}
          path: ${{ env.BUILD_DIR }}/bin/CompilerOSInfo*
          if-no-files-found: error

  build-macos-clang:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B "$BUILD_DIR" \
                -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
                -DCMAKE_C_COMPILER=clang

      - name: Build
        run: cmake --build "$BUILD_DIR" --config ${{ matrix.build-type }}

      - name: Run executable
        run: "$BUILD_DIR/bin/CompilerOSInfo"

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" -C ${{ matrix.build-type }} --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-clang-${{ matrix.build-type }}
          path: ${{ env.BUILD_DIR }}/bin/CompilerOSInfo*
          if-no-files-found: error

  build-windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        # 不要写死 -G "Visual Studio 17 2022"：windows-latest 自 2026-06 起
        # 只带 VS 2026 (v18)，写死会让 CMake 找不到实例。
        # 省略 -G 后 CMake 自动选机器上最新的 VS，对 VS2022/VS2026 镜像都兼容。
        run: |
          cmake -B "${{ env.BUILD_DIR }}" -A x64

      - name: Build
        run: cmake --build "${{ env.BUILD_DIR }}" --config ${{ matrix.build-type }}

      - name: Run executable
        run: |
          $exe = "${{ env.BUILD_DIR }}\bin\CompilerOSInfo.exe"
          if (-not (Test-Path $exe)) { throw "Not found: $exe" }
          & $exe

      - name: Test
        run: ctest --test-dir "${{ env.BUILD_DIR }}" -C ${{ matrix.build-type }} --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-${{ matrix.build-type }}
          path: ${{ env.BUILD_DIR }}/bin/CompilerOSInfo.exe
          if-no-files-found: error

  build-windows-mingw:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
        mingw-arch: [x86_64, i686]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          # 关键：显式切换 msystem，否则 i686 会用上 64 位的 PATH
          msystem: ${{ matrix.mingw-arch == 'x86_64' && 'MINGW64' || 'MINGW32' }}
          update: false
          install: >-
            mingw-w64-${{ matrix.mingw-arch }}-toolchain
            mingw-w64-${{ matrix.mingw-arch }}-cmake

      - name: Configure CMake (MinGW)
        shell: msys2 {0}
        run: |
          cmake -B "$BUILD_DIR" \
                -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
                -G "MinGW Makefiles"

      - name: Build (MinGW)
        shell: msys2 {0}
        run: cmake --build "$BUILD_DIR" --config ${{ matrix.build-type }}

      - name: Run executable (MinGW)
        shell: msys2 {0}
        run: "$BUILD_DIR/bin/CompilerOSInfo.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-mingw-${{ matrix.mingw-arch }}-${{ matrix.build-type }}
          path: ${{ env.BUILD_DIR }}/bin/CompilerOSInfo.exe
          if-no-files-found: error

  summary:
    runs-on: ubuntu-latest
    needs:
      [
        build-ubuntu-gcc,
        build-macos-clang,
        build-windows-msvc,
        build-windows-mingw,
      ]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: |
          echo "All builds completed successfully!"
          find . -name "CompilerOSInfo*" | sort
          echo "Total executables: $(find . -name 'CompilerOSInfo*' | wc -l)"

      - name: Create summary
        run: |
          {
            echo "# Build Summary"
            echo "All builds completed successfully!"
            echo ""
            echo "## Build Matrix:"
            echo "- ✅ Ubuntu + GCC (Release / Debug)"
            echo "- ✅ macOS + Clang (Release / Debug)"
            echo "- ✅ Windows + MSVC (Release / Debug)"
            echo "- ✅ Windows + MinGW-w64 (x86_64 / i686 × Release / Debug)"
          } >> "$GITHUB_STEP_SUMMARY"
